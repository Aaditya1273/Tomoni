name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: tomoni_owner
          POSTGRES_PASSWORD: dev_owner_pw
          POSTGRES_DB: tomoni
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U tomoni_owner -d tomoni" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['6390:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Database roles (same as infra/postgres/init.sql)
        run: PGPASSWORD=dev_owner_pw psql -h 127.0.0.1 -p 5544 -U tomoni_owner -d tomoni -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - name: Local env with throwaway keys
        run: node infra/scripts/setup-env.mjs

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Storybook builds
        run: pnpm --filter @tomoni/ui build

      - name: End-to-end (Playwright, WCAG 2.2 AA scans)
        run: |
          pnpm --filter @tomoni/web exec playwright install --with-deps chromium
          pnpm --filter @tomoni/web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-and-screens
          path: |
            apps/web/playwright-report
            apps/web/e2e/__screens__
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Dependency audit (production deps)
        run: pnpm audit --prod --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
