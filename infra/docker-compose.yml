name: tomoni

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: tomoni_owner
      POSTGRES_PASSWORD: ${TOMONI_PG_OWNER_PASSWORD:-dev_owner_pw}
      POSTGRES_DB: tomoni
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements', '-c', 'log_statement=none']
    ports: ['127.0.0.1:5544:5432']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tomoni_owner -d tomoni']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6390:6379']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Local observability (Phase 7): OTLP in on 4318, Grafana on 3300 with the Tomoni dashboard.
  # `docker compose -f infra/docker-compose.yml --profile observability up -d`, then run the API
  # and worker with OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318.
  observability:
    image: grafana/otel-lgtm:0.11.17
    profiles: ['observability']
    ports: ['127.0.0.1:3300:3000', '127.0.0.1:4318:4318']
    volumes:
      - ./grafana/tomoni.json:/otel-lgtm/tomoni-dashboard.json:ro
      - ./grafana/provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/tomoni.yaml:ro

volumes:
  pgdata:
  redisdata:
